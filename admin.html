<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Absensi DKR Batulicin</title>
  <link rel="stylesheet" href="admin.css">
</head>

<body>

<h2>ADMIN - ABSENSI DKR BATULICIN 2025–2028</h2>

<div class="layout">

  <!-- ================= SIDEBAR ================= -->
  <div class="sidebar">

    <!-- PENGATURAN JAM -->
    <div class="card">
      <h3>Pengaturan Jam Absensi</h3>
      <input type="number" id="jamMulai" placeholder="Jam Mulai (0-23)" min="0" max="23">
      <input type="number" id="jamSelesai" placeholder="Jam Selesai (0-23)" min="0" max="23">
      <button onclick="setJam()">Simpan Jam</button>
    </div>

    <!-- TAMBAH USER -->
    <div class="card">
      <h3>Tambah Anggota</h3>
      <input type="text" id="namaUser" placeholder="Nama Anggota">
      <button onclick="tambahUser()">Tambah</button>
    </div>

    <!-- LIST USER -->
    <div class="card">
      <h3>Daftar Anggota</h3>
      <table>
        <thead>
          <tr>
            <th>Nama</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tabelUser"></tbody>
      </table>
    </div>

  </div>

  <!-- ================= MAIN AREA ================= -->
  <div class="main-area">

    <!-- FILTER ABSENSI -->
    <div class="card">
      <h3>Filter Absensi per Tanggal</h3>
      <input type="date" id="filterTanggal">
      <button onclick="handleFilter()">Tampilkan</button>

      <table>
        <thead>
          <tr>
            <th>Nama</th>
            <th>Tanggal</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tabelAbsensi"></tbody>
      </table>
    </div>

    <!-- VALIDASI BULANAN -->
    <div class="card">
      <h3>Validasi Bulanan</h3>
      <input type="month" id="bulanValidasi">
      <button onclick="handleValidasi()">Cek</button>

      <table>
        <thead>
          <tr>
            <th>Nama</th>
            <th>Jumlah</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="tabelValidasi"></tbody>
      </table>
    </div>

    <!-- EXPORT -->
    <div class="card">
      <h3>Export Data</h3>
      <input type="month" id="bulanExport">
      <button onclick="exportExcel()">Export CSV</button>
      <button onclick="logout()">Logout</button>
    </div>

  </div>
</div>
  
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module" src="admin.js"></script>
<script type="module" src="auth.js"></script>

</body>
</html>
